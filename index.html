<!-- FREE WEATHER ALERT - FOR EVERYONE - 47 COUNTIES -->
<div class="card" style="border: 2px solid #1565c0;">
  <h2>🌦️ FREE Weather Alert - 47 Counties</h2>
  <p style="font-size:14px; line-height:1.5; color:#555;">
  BURE Kabisa! Chagua County yako, ujue kama kunanyesha leo - Panda au Usipande?
  </p>
  <br>
  <select id="alertCounty" onchange="checkAlert()">
    <option value="">-- Chagua County Yako --</option>
    <option>Mombasa</option><option>Kwale</option><option>Kilifi</option>
    <option>Tana River</option><option>Lamu</option><option>Taita-Taveta</option>
    <option>Garissa</option><option>Wajir</option><option>Mandera</option>
    <option>Marsabit</option><option>Isiolo</option><option>Meru</option>
    <option>Tharaka-Nithi</option><option>Embu</option><option>Kitui</option>
    <option>Machakos</option><option>Makueni</option><option>Nyandarua</option>
    <option>Nyeri</option><option>Kirinyaga</option><option>Murang'a</option>
    <option>Kiambu</option><option>Turkana</option><option>West Pokot</option>
    <option>Samburu</option><option>Trans Nzoia</option><option>Uasin Gishu</option>
    <option>Elgeyo-Marakwet</option><option>Nandi</option><option>Baringo</option>
    <option>Laikipia</option><option>Nakuru</option><option>Narok</option>
    <option>Kajiado</option><option>Kericho</option><option>Bomet</option>
    <option>Kakamega</option><option>Vihiga</option><option>Bungoma</option>
    <option>Busia</option><option>Siaya</option><option>Kisumu</option>
    <option>Homa Bay</option><option>Migori</option><option>Kisii</option>
    <option>Nyamira</option><option>Nairobi</option>
  </select>

  <div id="alertBox"></div>

  <button onclick="enableAlert()" style="width:100%; background:#1565c0; color:white; border:none; padding:14px; border-radius:12px; font-weight:800; margin-top:10px;">
    🔔 Pata Free Alert Kila Siku
  </button>
  <p style="font-size:12px; color:#888; text-align:center; margin-top:8px;">Tutakutumia alert simu yako ikinyesha kwenye County yako</p>
</div>

<script>
// Coordinates for 47 Counties - for Live Weather
const alertCoords = {
  "Mombasa":[-4.0435,39.6682],"Kwale":[-4.1814,39.4606],"Kilifi":[-3.5107,39.9093],
  "Tana River":[-1.5,40],"Lamu":[-2.2717,40.902],"Taita-Taveta":[-3.3161,38.4842],
  "Garissa":[-0.4532,39.646],"Wajir":[1.7471,40.0589],"Mandera":[3.9167,41.8333],
  "Marsabit":[2.3284,37.9899],"Isiolo":[0.3556,37.5833],"Meru":[0.0477,37.6491],
  "Tharaka-Nithi":[-0.3,37.9],"Embu":[-0.5333,37.45],"Kitui":[-1.3667,38.0167],
  "Machakos":[-1.5167,37.2667],"Makueni":[-1.8,37.6167],"Nyandarua":[-0.5333,36.6167],
  "Nyeri":[-0.4201,36.9476],"Kirinyaga":[-0.5,37.3],"Murang'a":[-0.7167,36.7833],
  "Kiambu":[-1.1714,36.8356],"Turkana":[3.1191,35.597],"West Pokot":[1.25,35.1],
  "Samburu":[0.55,37.5],"Trans Nzoia":[1.0167,35],"Uasin Gishu":[0.5167,35.2833],
  "Elgeyo-Marakwet":[0.85,35.5],"Nandi":[0.1833,35.1],"Baringo":[0.4667,35.9667],
  "Laikipia":[0.0167,36.8],"Nakuru":[-0.3031,36.08],"Narok":[-1.0833,36.95],
  "Kajiado":[-1.85,36.7833],"Kericho":[-0.3667,35.2833],"Bomet":[-0.7833,35.3333],
  "Kakamega":[0.0833,34.7667],"Vihiga":[0.0833,34.7167],"Bungoma":[0.5667,34.5667],
  "Busia":[0.4667,34.1117],"Siaya":[0.0611,34.2881],"Kisumu":[-0.0917,34.768],
  "Homa Bay":[-0.5273,34.4571],"Migori":[-1.0634,34.4731],"Kisii":[-0.6773,34.7796],
  "Nyamira":[-0.5667,34.9333],"Nairobi":[-1.2921,36.8219]
};

async function checkAlert(){
  let c = document.getElementById('alertCounty').value;
  let box = document.getElementById('alertBox');
  if(!c){ box.innerHTML=''; return; }
  box.innerHTML = '⏳ Inatafuta Live Weather ya ' + c + '...';
  let [lat, lon] = alertCoords[c];
  try {
    let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&daily=precipitation_probability_max&timezone=Africa%2FNairobi`);
    let j = await res.json();
    let temp = Math.round(j.current.temperature_2m);
    let code = j.current.weather_code;
    let rainProb = j.daily.precipitation_probability_max[0];
    let precip = j.current.precipitation;
    let isRain = (code>=51 && code<=67) || (code>=80 && code<=82) || (code>=95 && code<=99) || precip > 0 || rainProb > 60;

    if(isRain){
      box.innerHTML = `
        <div style="background:#e3f2fd; color:#1565c0; padding:16px; border-radius:12px; margin-top:12px; text-align:center; font-weight:800; line-height:1.5;">
          ☔ ALERT! MVUA ${c} - ${temp}°C<br>
          Chance ya Mvua: ${rainProb}%<br>
          <span style="font-size:15px;">✅ PANDA SASA! Wakati mzuri wa kupanda Maize, Beans, Potatoes</span>
        </div>`;
    } else {
      box.innerHTML = `
        <div style="background:#fff3e0; color:#e65100; padding:16px; border-radius:12px; margin-top:12px; text-align:center; font-weight:800; line-height:1.5;">
          ☀️ HAKUNA MVUA ${c} - ${temp}°C<br>
          Chance ya Mvua: ${rainProb}%<br>
          <span style="font-size:15px;">⛔ USIPANDE Maize Leo! Itakauka.<br>✅ Panda Sorghum, Cassava, Cowpeas - Zinavumilia Kavu</span>
        </div>`;
    }
    // Save county for daily alert
    localStorage.setItem('shamba_alert_county', c);
  } catch(e){
    box.innerHTML = 'Angalia anga la ' + c + ' - Kama mawingu meusi, panda. Kama jua kali, usipande Maize.';
  }
}

function enableAlert(){
  let c = document.getElementById('alertCounty').value;
  if(!c){ alert('Chagua County kwanza!'); return; }
  // Ask browser to allow notifications
  if("Notification" in window){
    Notification.requestPermission().then(p => {
      if(p === "granted"){
        alert('✅ Asante! Utapata Free Weather Alert ya ' + c + ' kila siku. Kama itanyesha, tutakuambia PANDA SASA!');
        // Test notification
        new Notification('🌦️ ShambaSmart Alert - ' + c, { body: 'Umejiunga na Free Weather Alert! Tutakuambia ikinyesha.' });
      } else {
        alert('✅ Umesajiliwa kwa Free Alert ya ' + c + '! Fungua site kila asubuhi kuona kama kunanyesha.');
      }
    });
  } else {
    alert('✅ Umesajiliwa kwa Free Alert ya ' + c + '!');
  }
  // Also save to Admin
  let alerts = JSON.parse(localStorage.getItem('shamba_alerts') || '[]');
  alerts.push({ county: c, date: new Date().toLocaleDateString() });
  localStorage.setItem('shamba_alerts', JSON.stringify(alerts));
}

// Auto-check if user already chose county before
window.addEventListener('load', () => {
  let saved = localStorage.getItem('shamba_alert_county');
  if(saved){
    document.getElementById('alertCounty').value = saved;
    checkAlert();
  }
});
</script>
